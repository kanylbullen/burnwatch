name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is all any job here needs: they check out, build and test. The
# default token is broader than that, and a compromised dependency in a build
# step would inherit whatever it is given.
permissions:
  contents: read

jobs:
  core:
    name: Forecast maths and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      # Covers the shared core, the Bun daemon and the Worker together, so the
      # two deployment shapes cannot drift apart on the payload they produce.
      - name: Typecheck
        run: bun run typecheck

  collector:
    name: Collector scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: sh -n collector/statusline.sh
      # PowerShell 5.1 decodes a BOM-less file as the legacy ANSI code page, so
      # a stray non-ASCII byte can end a string early and break the script on
      # Windows while looking fine everywhere else.
      - name: statusline.ps1 must be pure ASCII
        run: |
          if LC_ALL=C grep -n '[^ -~]' collector/statusline.ps1; then
            echo "::error file=collector/statusline.ps1::non-ASCII byte found"
            exit 1
          fi
          echo "collector/statusline.ps1 is pure ASCII"

  widget:
    name: Widget shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
      # Tauri links against the system webview on Linux; the other two ship one.
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Check and test
        run: cargo test --manifest-path widget/src-tauri/Cargo.toml
