[package]
name = "burnwatch-hub"
version = "0.1.0"
description = "The desktop hub's engine: local ingest, sample store and forecast"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
