[package]
name = "burnwatch-protocol"
version = "0.1.0"
description = "burnwatch relay protocol v1: channel keys, state envelopes and device pairing"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
